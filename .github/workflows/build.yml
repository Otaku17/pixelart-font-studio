name: Build desktop app

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact_name: pixelart-font-studio-darwin-universal
          - os: windows-2022
            artifact_name: pixelart-font-studio-windows-amd64
          - os: ubuntu-24.04
            artifact_name: pixelart-font-studio-linux-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          xcode-select --install || true

      # npm workspaces: one lockfile at the root installs frontend + packages/*
      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Lint, typecheck and test JS
        shell: bash
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Wails
        shell: bash
        run: |
          export GOBIN="$HOME/go/bin"
          rm -f "$GOBIN/wails"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          ls -l "$GOBIN/wails" || true

      - name: Build app
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
          export PATH="$HOME/go/bin:$PATH"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Intel + Apple Silicon in one app, as the asset name says
            "$HOME/go/bin/wails" build -platform darwin/universal
          elif [ "$RUNNER_OS" = "Linux" ]; then
            # Ubuntu 24.04 only ships WebKitGTK 4.1, which Wails needs this tag for
            "$HOME/go/bin/wails" build -tags webkit2_41
          else
            "$HOME/go/bin/wails" build
          fi

      - name: Test Go
        shell: bash
        run: go test . ./backend

      # One file per platform, so the in-app updater can pick the right asset.
      - name: Package release asset
        shell: bash
        run: |
          mkdir -p build/release
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent build/bin/pixelart-font-studio.app "build/release/${{ matrix.artifact_name }}.zip"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            tar -czf "build/release/${{ matrix.artifact_name }}.tar.gz" -C build/bin pixelart-font-studio
          else
            cp build/bin/pixelart-font-studio.exe build/release/pixelart-font-studio.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/release/

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: Release ${{ github.event.release.tag_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/**
